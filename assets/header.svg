      <path d="M -48 64 Q -72 67 -77 44 Q -54 46 -48 64 Z" stroke="none"/>
      <path d="M -66 48 Q -91 45 -91 23 Q -69 29 -66 48 Z" stroke="none"/>
      <path d="M -81 27 Q -104 20 -99 -1 Q -81 8 -81 27 Z" stroke="none"/>
      <path d="M -90 4 Q -111 -8 -102 -28 Q -86 -14 -90 4 Z" stroke="none"/>
      <path d="M -93 -20 Q -110 -36 -97 -53 Q -84 -37 -93 -20 Z" stroke="none"/>
      <path d="M -90 -43 Q -98 -62 -83 -76 Q -75 -58 -90 -43 Z" stroke="none"/>
    </g>
  </defs>
  <g clip-path="url(#bounds)">
