<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Duke Venator</title>
  <desc id="description">Developer and modder from Australia. A royal purple banner with white lettering, gold trim, and a crowned DV shield framed by laurel branches.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21132f"/>
      <stop offset="0.6" stop-color="#140e20"/>
      <stop offset="1" stop-color="#2b1642"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#fae9b5"/>
      <stop offset="0.5" stop-color="#dcb969"/>
      <stop offset="1" stop-color="#ab803d"/>
    </linearGradient>
    <radialGradient id="crest-glow">
      <stop stop-color="#7547a1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7547a1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bounds"><rect width="1200" height="320" rx="16"/></clipPath>
    <path id="shield" d="M -65 -62 H 65 V 0 C 65 45 35 72 0 88 C -35 72 -65 45 -65 0 Z"/>
    <g id="laurel" fill="#dcb969" stroke="#dcb969" stroke-width="1.3">
