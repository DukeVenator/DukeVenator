    <ellipse cx="990" cy="160" rx="205" ry="190" fill="url(#crest-glow)"/>
    <path d="M 790 26 V 294" stroke="#8b65ad" stroke-opacity="0.25"/>
    <path d="M 802 26 V 294" stroke="#dcb969" stroke-opacity="0.12"/>
    <rect x="3" y="3" width="1194" height="314" rx="14" fill="none" stroke="#7843a8" stroke-width="6"/>
    <rect x="12" y="12" width="1176" height="296" rx="8" fill="none" stroke="#dcb969" stroke-opacity="0.7"/>
    <path d="M 27 49 V 27 H 49 M 1151 27 H 1173 V 49 M 27 271 V 293 H 49 M 1151 293 H 1173 V 271" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 57 60 H 84" stroke="#dcb969" stroke-width="3"/>
    <text x="98" y="65" fill="#e7ca87" font-family="Consolas, monospace" font-size="15" letter-spacing="3">DUKEVENATOR / GITHUB</text>
    <text x="53" y="158" fill="#fcfaf6" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700" letter-spacing="1">DUKE VENATOR</text>
    <text x="57" y="202" fill="#e1d7ea" font-family="Segoe UI, Arial, sans-serif" font-size="23">Developer. Modder. Down the AI rabbit hole.</text>
    <path d="M 58 229 H 113 M 121 225 L 125 229 L 121 233 L 117 229 Z M 133 229 H 188" fill="#dcb969" stroke="#dcb969" stroke-width="0.8"/>
    <text x="57" y="270" fill="#e7ca87" font-family="Consolas, monospace" font-size="15" letter-spacing="2">AUTOMATION / GAME MODS / AUSTRALIA</text>
